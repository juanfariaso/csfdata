site_name: Clustererd Star Formation Database

theme:
  name: material

plugins:
  - search

  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            members: null
            docstring_style: google
            members_order: source
            show_source: true
            show_submodules: false
            show_if_no_docstring: false
            show_root_heading: true
            show_symbol_type_heading: true
            filters: 
              - public
              - "!^__version__$"
              - "!^__all__$"
              - "!^_"
            summary:
              modules: true
              functions: true

  - api-autonav:
      modules:
        - csfdata
      nav_section_title: API Reference
      api_root_uri: reference
      nav_item_prefix : ""
      show_full_namespace: true

nav:
  - Home: index.md
  - Units: units.md
  - Command Line: command-line.md
  - Catalogue: catalogue.md
  - Catalogue Maintenance: catalogue-maintenance.md
  - Catalogue Workflow: catalogue-workflow.md
  - Lite Catalogue Workflow: lite-catalogue-workflow.md
  - Analysis Add-Ons: analysis-add-ons.md

extra_css:
   - stylesheets/api-reference.css
